name: archive-delivery-pipeline

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      case:
        description: "Golden caseId or all"
        required: true
        default: all
        type: string

permissions:
  contents: read

concurrency:
  group: archive-delivery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  local-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Validate Markdown pipeline registry
        run: python3 scripts/pipeline_registry.py validate
      - name: Validate scripts and Compose
        run: |
          bash -n scripts/*.sh
          docker compose -f deploy/docker-compose.production.yml --env-file deploy/env.production.example config --quiet
      - name: Python logic tests
        run: python3 -m unittest nodes/python/test_archive_repair.py scripts/test_pipeline_registry.py -v
      - name: Maven logic and golden pipeline tests
        run: mvn -q -s deploy/maven-settings.xml test
      - name: Frontend tests and build
        working-directory: web
        run: |
          npm ci
          npm run test
          npm run build

  production-golden:
    needs: local-validation
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
      - name: Package the reviewed commit
        run: git archive --format=tar.gz --output /tmp/archive-delivery-platform.tar.gz HEAD
      - name: Upload the reviewed commit
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          ssh-keyscan -H "$PROD_HOST" >> "$HOME/.ssh/known_hosts"
          scp /tmp/archive-delivery-platform.tar.gz "$PROD_USER@$PROD_HOST:/tmp/"
          ssh "$PROD_USER@$PROD_HOST" '
            set -e
            mkdir -p /opt/archive-delivery-platform
            tar -xzf /tmp/archive-delivery-platform.tar.gz -C /opt/archive-delivery-platform
            rm -f /tmp/archive-delivery-platform.tar.gz
            cd /opt/archive-delivery-platform
            chmod +x scripts/*.sh scripts/*.py
            python3 scripts/provision-production-config.py
            ./scripts/production-registry.sh "${{ inputs.case || 'all' }}"
          '
      - name: Package production evidence
        if: always()
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          ssh "$PROD_USER@$PROD_HOST" '
            cd /opt/archive-delivery-platform
            tar -czf /tmp/archive-delivery-evidence.tar.gz -C docs evidence
          '
          scp "$PROD_USER@$PROD_HOST:/tmp/archive-delivery-evidence.tar.gz" /tmp/
          mkdir -p docs
          tar -xzf /tmp/archive-delivery-evidence.tar.gz -C docs
      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-golden-evidence
          path: docs/evidence
          retention-days: 30
