x-worker-common: &worker-common
  build:
    context: ..
    dockerfile: deploy/Dockerfile.worker
  depends_on:
    postgres:
      condition: service_healthy
    powerjob-server:
      condition: service_started
  environment: &worker-environment
    SPRING_PROFILES_ACTIVE: production
    ARCHIVE_DB_URL: jdbc:postgresql://postgres:5432/archive_delivery
    ARCHIVE_DB_USER: ${ARCHIVE_DB_USER:-archive}
    ARCHIVE_DB_PASSWORD: ${ARCHIVE_DB_PASSWORD:-archive_local}
    ARCHIVE_DISCOVERY_MODE: oss
    ARCHIVE_DEBUG_LOOP: "false"
    POWERJOB_ENABLED: "true"
    POWERJOB_APP_NAME: archive-delivery-mvp
    POWERJOB_SERVER_ADDRESS: powerjob-server:7700

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: archive_delivery
      POSTGRES_USER: ${ARCHIVE_DB_USER:-archive}
      POSTGRES_PASSWORD: ${ARCHIVE_DB_PASSWORD:-archive_local}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - archive_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ARCHIVE_DB_USER:-archive} -d archive_delivery"]
      interval: 2s
      timeout: 2s
      retries: 30

  mysql:
    image: mysql:8.0.36
    environment:
      MYSQL_ROOT_PASSWORD: powerjob_local
      MYSQL_DATABASE: powerjob
    volumes:
      - powerjob_mysql:/var/lib/mysql
      - ./powerjob-mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -ppowerjob_local --silent"]
      interval: 3s
      timeout: 3s
      retries: 40

  powerjob-server:
    image: powerjob/powerjob-server:v5.1.7
    environment:
      PARAMS: >-
        --spring.datasource.core.jdbc-url=jdbc:mysql://mysql:3306/powerjob?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
        --spring.datasource.core.username=root
        --spring.datasource.core.password=powerjob_local
        --oms.storage.dfs.mysql_series.url=jdbc:mysql://mysql:3306/powerjob?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
        --oms.storage.dfs.mysql_series.username=root
        --oms.storage.dfs.mysql_series.password=powerjob_local
        --oms.mongodb.enable=false
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:7700:7700"

  archive-server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ARCHIVE_DB_URL: jdbc:postgresql://postgres:5432/archive_delivery
      ARCHIVE_DB_USER: ${ARCHIVE_DB_USER:-archive}
      ARCHIVE_DB_PASSWORD: ${ARCHIVE_DB_PASSWORD:-archive_local}
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--connect-timeout", "2", "--max-time", "3", "http://127.0.0.1:8080/actuator/health"]
      interval: 3s
      timeout: 3s
      retries: 30

  worker-line-1:
    <<: *worker-common
    environment:
      <<: *worker-environment
      HOSTNAME: worker-line-1
      ARCHIVE_LINE_ID: "1"
    volumes:
      - archive_data:/data
      - ${HOME}/.ssh/archive-delivery-mvp/line-1-id_ed25519:/run/secrets/line-1-id_ed25519:ro

  worker-line-2:
    <<: *worker-common
    environment:
      <<: *worker-environment
      HOSTNAME: worker-line-2
      ARCHIVE_LINE_ID: "2"
    volumes:
      - archive_data:/data
      - ${HOME}/.ssh/archive-delivery-mvp/line-2-id_ed25519:/run/secrets/line-2-id_ed25519:ro

  worker-line-3:
    <<: *worker-common
    environment:
      <<: *worker-environment
      HOSTNAME: worker-line-3
      ARCHIVE_LINE_ID: "3"
    volumes:
      - archive_data:/data
      - ${HOME}/.ssh/archive-delivery-mvp/line-3-id_ed25519:/run/secrets/line-3-id_ed25519:ro

volumes:
  archive_pg:
  powerjob_mysql:
  archive_data:
