# 公网渠道看板仅允许只读路由；不转发交付写接口、实体/Pipeline、健康管理或来源注册。
log_format monitor_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_user_agent"';
server {
    listen 80;
    server_tokens off;
    access_log /var/log/nginx/access.log monitor_safe;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    client_max_body_size 1k;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types application/javascript text/css application/json;
    location = / { return 302 /monitor; }
    location = /monitor {
        limit_except GET { deny all; }
        add_header Cache-Control "no-store";
        proxy_pass http://archive-server:8080/monitor.html;
        proxy_set_header Host $host;
    }
    location /assets/ {
        limit_except GET { deny all; }
        proxy_pass http://archive-server:8080;
    }
    location = /api/v1/ingest-sources/monitor {
        limit_except GET { deny all; }
        proxy_pass http://archive-server:8080;
    }
    location ~ ^/api/v1/ingest-sources/[1-9][0-9]*/(trend|changes)$ {
        limit_except GET { deny all; }
        proxy_pass http://archive-server:8080;
    }
    location / { return 404; }
}
