x-worker-common: &worker-common
  build:
    context: ..
    dockerfile: deploy/Dockerfile.worker
  image: ${ARCHIVE_WORKER_IMAGE:-archive-delivery-worker:production}
  depends_on:
    postgres:
      condition: service_healthy
    powerjob-server:
      condition: service_started
  # 同机 8 核 16G：广播触发每个 Worker 每次只推进一个节点，八个实例共享组内上限。
  environment: &worker-environment
    SPRING_PROFILES_ACTIVE: production
    JAVA_TOOL_OPTIONS: ${ARCHIVE_WORKER_JAVA_OPTIONS:--Xms128m -Xmx512m}
    ARCHIVE_DB_URL: jdbc:postgresql://postgres:5432/archive_delivery
    ARCHIVE_DB_USER: ${ARCHIVE_DB_USER:?ARCHIVE_DB_USER is required}
    ARCHIVE_DB_PASSWORD: ${ARCHIVE_DB_PASSWORD:?ARCHIVE_DB_PASSWORD is required}
    # 八个 JVM 共用 PG 默认 100 连接额度，为 API、验收和运维连接保留余量。
    SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${ARCHIVE_WORKER_DB_POOL_SIZE:-4}
    ARCHIVE_UPGRADE_AUTHORIZED: ${ARCHIVE_UPGRADE_AUTHORIZED:-}
    ARCHIVE_WORKER_GROUP: ${ARCHIVE_WORKER_GROUP:-group1}
    ARCHIVE_MAX_RUNNING_TASKS: ${ARCHIVE_MAX_RUNNING_TASKS:-8}
    ARCHIVE_PREPARATION_DOWNLOAD_THREADS: ${ARCHIVE_PREPARATION_DOWNLOAD_THREADS:-16}
    ARCHIVE_TASK_LEASE_SECONDS: ${ARCHIVE_TASK_LEASE_SECONDS:-900}
    ARCHIVE_CLEANUP_WORK_AFTER_VERIFY: ${ARCHIVE_CLEANUP_WORK_AFTER_VERIFY:-true}
    POWERJOB_ENABLED: "true"
    POWERJOB_APP_NAME: ${POWERJOB_APP_NAME:-archive-delivery}
    POWERJOB_SERVER_ADDRESS: powerjob-server:7700
  volumes:
    - archive_data:/data
    - ../nodes/python:/app/nodes/python:ro

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: archive_delivery
      POSTGRES_USER: ${ARCHIVE_DB_USER:?ARCHIVE_DB_USER is required}
      POSTGRES_PASSWORD: ${ARCHIVE_DB_PASSWORD:?ARCHIVE_DB_PASSWORD is required}
    ports: ["${ARCHIVE_PG_BIND_ADDRESS:-127.0.0.1}:5432:5432"]
    volumes: [archive_pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ARCHIVE_DB_USER} -d archive_delivery"]
      interval: 2s
      timeout: 2s
      retries: 30

  mysql:
    image: mysql:8.0.36
    environment:
      MYSQL_ROOT_PASSWORD: ${POWERJOB_MYSQL_ROOT_PASSWORD:?POWERJOB_MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: powerjob
    volumes:
      - powerjob_mysql:/var/lib/mysql
      - ./powerjob-mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 3s
      timeout: 3s
      retries: 40

  powerjob-server:
    image: powerjob/powerjob-server:v5.1.7
    environment:
      JVMOPTIONS: ${POWERJOB_JVMOPTIONS:-}
      PARAMS: >-
        --spring.datasource.core.jdbc-url=jdbc:mysql://mysql:3306/powerjob?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
        --spring.datasource.core.username=root --spring.datasource.core.password=${POWERJOB_MYSQL_ROOT_PASSWORD}
        --oms.storage.dfs.mysql_series.url=jdbc:mysql://mysql:3306/powerjob?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
        --oms.storage.dfs.mysql_series.username=root --oms.storage.dfs.mysql_series.password=${POWERJOB_MYSQL_ROOT_PASSWORD}
        --oms.mongodb.enable=false
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${POWERJOB_BIND_ADDRESS:-127.0.0.1}:7700:7700"
      - "${POWERJOB_PROTOCOL_BIND_ADDRESS:-127.0.0.1}:10010:10010"

  archive-server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      JAVA_TOOL_OPTIONS: ${ARCHIVE_SERVER_JAVA_OPTIONS:--Xms128m -Xmx512m}
      ARCHIVE_DB_URL: jdbc:postgresql://postgres:5432/archive_delivery
      ARCHIVE_DB_USER: ${ARCHIVE_DB_USER:?ARCHIVE_DB_USER is required}
      ARCHIVE_DB_PASSWORD: ${ARCHIVE_DB_PASSWORD:?ARCHIVE_DB_PASSWORD is required}
      ARCHIVE_UPGRADE_AUTHORIZED: ${ARCHIVE_UPGRADE_AUTHORIZED:-}
      # 只在 API 进程扫描来源；机器人地址是受控 Secret，不传给 Worker 或看板。
      ARCHIVE_INGEST_MONITOR_ENABLED: ${ARCHIVE_INGEST_MONITOR_ENABLED:-false}
      ARCHIVE_INGEST_MONITOR_POLL_INTERVAL_MS: ${ARCHIVE_INGEST_MONITOR_POLL_INTERVAL_MS:-60000}
      ARCHIVE_INGEST_MONITOR_CONTINUOUS_PERIOD: ${ARCHIVE_INGEST_MONITOR_CONTINUOUS_PERIOD:-PT30M}
      ARCHIVE_INGEST_MONITOR_REPORT_INTERVAL: ${ARCHIVE_INGEST_MONITOR_REPORT_INTERVAL:-PT1H}
      ARCHIVE_INGEST_MONITOR_PIPELINE_CODE: ${ARCHIVE_INGEST_MONITOR_PIPELINE_CODE:-archive-batch}
      ARCHIVE_INGEST_MONITOR_WEBHOOK_URL: ${ARCHIVE_INGEST_MONITOR_WEBHOOK_URL:-}
      ARCHIVE_INGEST_MONITOR_MAX_OBJECTS: ${ARCHIVE_INGEST_MONITOR_MAX_OBJECTS:-1000000}
      ARCHIVE_INGEST_MONITOR_DASHBOARD_URL: ${ARCHIVE_INGEST_MONITOR_DASHBOARD_URL:-}
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - archive_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--connect-timeout", "2", "--max-time", "3", "http://127.0.0.1:8080/actuator/health"]
      interval: 3s
      timeout: 3s
      retries: 40

  # 公网只提供渠道看板及限定的只读 API，交付管理端口仍留在回环。
  monitor-web:
    image: nginx:1.28-alpine
    depends_on:
      archive-server:
        condition: service_healthy
    ports: ["${ARCHIVE_MONITOR_BIND_ADDRESS:-127.0.0.1}:${ARCHIVE_MONITOR_PORT:-8090}:80"]
    volumes:
      - ./monitor.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/monitor"]
      interval: 10s
      timeout: 3s
      retries: 6

  worker-1:
    <<: *worker-common
    environment:
      <<: *worker-environment
      HOSTNAME: worker-1

  worker-2:
    <<: *worker-common
    environment:
      <<: *worker-environment
      HOSTNAME: worker-2

  worker-3:
    <<: *worker-common
    environment:
      <<: *worker-environment
      HOSTNAME: worker-3

  worker-4:
    <<: *worker-common
    environment:
      <<: *worker-environment
      HOSTNAME: worker-4

  worker-5:
    <<: *worker-common
    environment:
      <<: *worker-environment
      HOSTNAME: worker-5

  worker-6:
    <<: *worker-common
    environment:
      <<: *worker-environment
      HOSTNAME: worker-6

  worker-7:
    <<: *worker-common
    environment:
      <<: *worker-environment
      HOSTNAME: worker-7

  worker-8:
    <<: *worker-common
    environment:
      <<: *worker-environment
      HOSTNAME: worker-8

  ftp-june:
    profiles: ["embedded-ftp"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.ftp
    environment:
      FTP_USER_NAME: ${PROD_ENTITY_1_ACCOUNT:-june}
      FTP_USER_PASS: ${PROD_FTP_ENTITY_1_PASSWORD:?PROD_FTP_ENTITY_1_PASSWORD is required}
      FTP_USER_HOME: /home/ftpusers/june
      FTP_ALLOW_DATE_CLEANUP: ${FTP_ALLOW_DATE_CLEANUP:-false}
      PUBLICHOST: ftp-june
    volumes:
      - ${PROD_JUNE_HOST_ROOT:?PROD_JUNE_HOST_ROOT is required}:/home/ftpusers/june

volumes:
  archive_pg:
  powerjob_mysql:
  archive_data:
