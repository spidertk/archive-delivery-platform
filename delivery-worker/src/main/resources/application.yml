spring:
  application:
    name: archive-delivery-worker
  datasource:
    url: ${ARCHIVE_DB_URL:jdbc:postgresql://localhost:55432/archive_delivery}
    username: ${ARCHIVE_DB_USER:archive}
    password: ${ARCHIVE_DB_PASSWORD:archive_local}
    hikari:
      schema: archive_delivery
  flyway:
    enabled: true
    schemas: archive_delivery
    default-schema: archive_delivery
powerjob:
  worker:
    enabled: ${POWERJOB_ENABLED:false}
    app-name: ${POWERJOB_APP_NAME:archive-delivery-mvp}
    server-address: ${POWERJOB_SERVER_ADDRESS:localhost:7700}
    protocol: http
    port: 27777
    store-strategy: disk
    allow-lazy-connect-server: true
archive:
  worker-id: ${HOSTNAME:local-worker}
  line-id: ${ARCHIVE_LINE_ID:0}
  async-execution: ${ARCHIVE_ASYNC_EXECUTION:false}
  discovery-mode: ${ARCHIVE_DISCOVERY_MODE:oss}
  debug-loop: ${ARCHIVE_DEBUG_LOOP:false}
  archive-date: ${ARCHIVE_DATE:2026-10-30}
  business-timezone: Asia/Shanghai
  delivery-cutoff-time: "02:00"
  group-size: 5
  max-ticks: 250
  local-source-dir: ${ARCHIVE_LOCAL_SOURCE_DIR:/samples}
  work-root: ${ARCHIVE_WORK_ROOT:/data/work}
  hz-root: ${ARCHIVE_HZ_ROOT:/data/hz-oss}
  sg-root: ${ARCHIVE_SG_ROOT:/data/sg-oss}
  ftp-root: ${ARCHIVE_FTP_ROOT:/data/ftp}
  python-command: ${ARCHIVE_PYTHON_COMMAND:python3}
  python-script: ${ARCHIVE_PYTHON_SCRIPT:/app/nodes/python/archive_repair.py}
logging:
  level:
    com.powerjob.archive: INFO
