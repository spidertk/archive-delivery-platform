spring:
  application:
    name: archive-delivery-worker
  datasource:
    url: ${ARCHIVE_DB_URL:jdbc:postgresql://localhost:5432/archive_delivery}
    username: ${ARCHIVE_DB_USER:archive}
    password: ${ARCHIVE_DB_PASSWORD:archive_local}
    hikari:
      schema: archive_delivery
      connection-init-sql: SET archive_delivery.upgrade_authorized = '${ARCHIVE_UPGRADE_AUTHORIZED:}'
  flyway:
    enabled: true
    schemas: archive_delivery
    default-schema: archive_delivery
powerjob:
  worker:
    enabled: ${POWERJOB_ENABLED:false}
    app-name: ${POWERJOB_APP_NAME:archive-delivery}
    server-address: ${POWERJOB_SERVER_ADDRESS:localhost:7700}
    protocol: http
    port: ${POWERJOB_WORKER_PORT:27777}
    store-strategy: disk
    allow-lazy-connect-server: true
archive:
  worker-id: ${HOSTNAME:local-worker}
  worker-group: ${ARCHIVE_WORKER_GROUP:group1}
  max-running-tasks: ${ARCHIVE_MAX_RUNNING_TASKS:3}
  work-root: ${ARCHIVE_WORK_ROOT:/data/work}
  ftp-verification-root: ${ARCHIVE_FTP_VERIFY_ROOT:/data/ftp-verify}
  python-command: ${ARCHIVE_PYTHON_COMMAND:python3}
  python-script: ${ARCHIVE_PYTHON_SCRIPT:/app/nodes/python/archive_repair.py}
  python-merge-script: ${ARCHIVE_PYTHON_MERGE_SCRIPT:/app/nodes/python/archive_merge.py}
  ftp-verify-script: ${ARCHIVE_FTP_VERIFY_SCRIPT:/app/nodes/python/ftp_download_verify.py}
logging:
  level:
    com.powerjob.archive: INFO
