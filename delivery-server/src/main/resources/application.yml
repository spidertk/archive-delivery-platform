server:
  address: 0.0.0.0
  port: 8080
spring:
  application:
    name: archive-delivery-server
  datasource:
    url: ${ARCHIVE_DB_URL:jdbc:postgresql://localhost:5432/archive_delivery}
    username: ${ARCHIVE_DB_USER:archive}
    password: ${ARCHIVE_DB_PASSWORD:archive_local}
    hikari:
      schema: archive_delivery
      connection-init-sql: SET archive_delivery.upgrade_authorized = '${ARCHIVE_UPGRADE_AUTHORIZED:}'
  flyway:
    enabled: true
    schemas: archive_delivery
    default-schema: archive_delivery
    ignore-missing-migrations: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
management:
  endpoints:
    web:
      exposure:
        include: health
archive:
  ingest-monitor:
    enabled: ${ARCHIVE_INGEST_MONITOR_ENABLED:false}
    poll-interval-ms: ${ARCHIVE_INGEST_MONITOR_POLL_INTERVAL_MS:60000}
    continuous-period: ${ARCHIVE_INGEST_MONITOR_CONTINUOUS_PERIOD:PT30M}
    report-interval: ${ARCHIVE_INGEST_MONITOR_REPORT_INTERVAL:PT1H}
    pipeline-code: ${ARCHIVE_INGEST_MONITOR_PIPELINE_CODE:archive-batch}
    webhook-url: ${ARCHIVE_INGEST_MONITOR_WEBHOOK_URL:}
    max-objects: ${ARCHIVE_INGEST_MONITOR_MAX_OBJECTS:1000000}
    dashboard-url: ${ARCHIVE_INGEST_MONITOR_DASHBOARD_URL:}
