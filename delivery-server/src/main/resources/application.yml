server:
  address: 0.0.0.0
  port: 8080
spring:
  application:
    name: archive-delivery-server
  datasource:
    url: ${ARCHIVE_DB_URL:jdbc:postgresql://localhost:55432/archive_delivery}
    username: ${ARCHIVE_DB_USER:archive}
    password: ${ARCHIVE_DB_PASSWORD:archive_local}
    hikari:
      schema: archive_delivery
      connection-init-sql: SET archive_delivery.upgrade_authorized = '${ARCHIVE_UPGRADE_AUTHORIZED:}'
  flyway:
    enabled: true
    schemas: archive_delivery
    default-schema: archive_delivery
  jackson:
    deserialization:
      fail-on-unknown-properties: true
management:
  endpoints:
    web:
      exposure:
        include: health
